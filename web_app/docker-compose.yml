# Databases only. Web app + CodeCome CLI run natively.
services:
  postgres:
    image: postgres:15-alpine
    container_name: codecome-postgres
    environment:
      POSTGRES_DB: codecome_db
      POSTGRES_USER: codecome
      POSTGRES_PASSWORD: codecome
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codecome"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codecome-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
